[tool.poetry]
name = "hallucination-detector"
version = "0.1.0"
description = "Legal Hallucination Detection Engine for RAG systems"
authors = ["LegalLies Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
# Core NLP
sentence-transformers = "^2.2.2"
spacy = "^3.5.0"
transformers = "^4.30"
torch = "^2.0.0"
accelerate = "^0.24.0"  # Model optimization and device mapping (no quantization for steering)

# Legal-specific
eyecite = "^2.4.0"
juriscraper = "^2.6"

# Text processing
rapidfuzz = "^3.0"
rank-bm25 = "^0.2.2"

# ML utilities
scikit-learn = "^1.0"
numpy = "^1.24"

# Graph operations (Phase 3)
networkx = "^3.0"

# API & data
pydantic = "^2.0"
pydantic-settings = "^2.0"
fastapi = "^0.100"
uvicorn = "^0.24.0"
pandas = "^2.0"
openpyxl = "^3.1"
requests = "^2.32.5"

# Ingestion infrastructure
redis = "^5.0.0"
PyPDF2 = "^3.0.0"
beautifulsoup4 = "^4.12.0"
lxml = "^5.2.0"

# Optional: Advanced queue backends
pika = {version = "^1.3.0", optional = true}  # RabbitMQ
boto3 = {version = "^1.29.0", optional = true}  # AWS SQS

# Visualization (optional)
matplotlib = "^3.7"
seaborn = "^0.12"
datasets = "^4.4.1"
hf-transfer = "^0.1.9"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
black = "^23.0"
isort = "^5.12"
mypy = "^1.0"
pre-commit = "^3.0"
jupyter = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --strict-markers"
