[pytest]
# Pytest configuration for Legal Hallucination Detector

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for organizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_models: marks tests that require model downloads

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options (if using pytest-cov)
# Uncomment to enable coverage reporting
# addopts = --cov=src --cov-report=html --cov-report=term

# Ignore paths
norecursedirs = .git .venv venv env ENV __pycache__ *.egg-info dist build

# Timeout (if using pytest-timeout)
# timeout = 300

# Parallel execution (if using pytest-xdist)
# Use: pytest -n auto
# addopts = -n auto
